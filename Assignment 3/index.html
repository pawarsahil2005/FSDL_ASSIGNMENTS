<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Trendify | Online Fashion Store</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Navbar -->
<nav class="navbar px-4">
  <a class="navbar-brand" href="#">Trendify</a>
  <a href="cart.html" class="cart-link">
    🛒 Cart (<span id="cartCount">0</span>)
  </a>
</nav>

<!-- Hero -->
<div class="text-center mt-4">
  <h2 class="fw-bold">Trendify</h2>
  <p class="text-muted">Where Fashion Meets Trend ✨</p>
</div>

<!-- Filters -->
<div class="container text-center mt-3">
  <button class="btn filter-btn" onclick="filterProducts('all')">All</button>
  <button class="btn filter-btn" onclick="filterProducts('Men')">Men</button>
  <button class="btn filter-btn" onclick="filterProducts('Women')">Women</button>
</div>

<!-- Products -->
<div class="container mt-4">
  <div class="row" id="productList"></div>
</div>

<script src="script.js"></script>
</body>
</html>

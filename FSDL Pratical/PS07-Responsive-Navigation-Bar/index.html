<!DOCTYPE html>
<html>

<head>
    <title>Responsive Navbar</title>
    <style>
        body {
            margin: 0;
            font-family: Arial;
        }

        nav {
            background: #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
        }

        .logo {
            color: white;
            font-size: 22px;
            font-weight: bold;
        }

        ul {
            list-style: none;
            display: flex;
            margin: 0;
            padding: 0;
        }

        ul li {
            position: relative;
        }

        ul li a {
            display: block;
            padding: 15px 20px;
            color: white;
            text-decoration: none;
        }

        ul li a:hover {
            background: #555;
        }

        .dropdown-menu {
            display: none;
            position: absolute;
            top: 50px;
            left: 0;
            background: #444;
            min-width: 150px;
        }

        .dropdown-menu li {
            display: block;
        }

        .dropdown:hover .dropdown-menu {
            display: block;
        }

        .menu-icon {
            display: none;
            font-size: 28px;
            color: white;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <nav>
        <div class="logo">MyWebsite</div>
        <ul id="menu">
            <li><a href="#">Home</a></li>
            <li class="dropdown">
                <a href="#">Services</a>
                <ul class="dropdown-menu">
                    <li><a href="#">Web Design</a></li>
                    <li><a href="#">Development</a></li>
                    <li><a href="#">SEO</a></li>
                </ul>
            </li>
            <li><a href="#">About</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
        <div class="menu-icon" onclick="toggleMenu()">Menu</div>
    </nav>
    <script>
        function toggleMenu() {
            document.getElementById("menu")
                .classList.toggle("show");
        }
    </script>
</body>

</html>

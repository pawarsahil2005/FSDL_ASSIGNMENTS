<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin:0px;
            padding: 0px;
            text-align: center;
        }

        .buttons{
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        button{
            margin: 10px;
            padding: 8px;
            border-radius: 20px;
            background-color: rgb(159, 201, 238);
            transition: 0.3s;
        }

        button:hover{
            background-color: aquamarine;
            transform: scale(1.1);
        }

        .gallery{
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            max-width: 900px;
            margin: auto;
        }

        .gallery img{
            background-color: rgb(147, 147, 147);
            gap: 20px;
            width: 100%;
            height: 100%;
            border-radius: 20px;
        }
    </style>
</head>

<body>
    <h2>Image Gallery</h2>

    <!-- Filter Buttons -->
    <div class="buttons">
        <button onclick="filterCategory('all')">ALL</button>
        <button onclick="filterCategory('nature')">Nature</button>
        <button onclick="filterCategory('animal')">Animal</button>
        <button onclick="filterCategory('sports')">Sports</button>
    </div>

    <div class="gallery">
        <img src="" alt="sports.png" class="category sports">
        <img src="" alt="nature.png" class="category nature">
        <img src="" alt="animal.png" class="category animal">
        <img src="" alt="nature.png" class="category nature">
        <img src="" alt="animal.png" class="category animal">
        <img src="" alt="city.png"  class="category city">
        <img src="" alt="animal.png" class="category animal">
    </div>

    <script>
        function filterCategory(cat){
            let items = document.getElementsByClassName("category");

            for(let i = 0; i < items.length; i++)
            {
                items[i].style.display = "block"; // Initially All visible

                if(cat != "all" && !items[i].classList.contains(cat)){
                    items[i].style.display = "none";
                }
            }
        }
    </script>
</body>


</html>

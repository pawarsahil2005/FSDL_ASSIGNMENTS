<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
        }

        #searchBar {
            width: 60%;
            padding: 10px;
            font-size: 18px;
            margin: 20px;
            border-radius: 5px;
            border: 1px solid gray;
        }

        table {
            width: 80%;
            margin: auto;
            border-collapse: collapse;
            background: white;
        }

        th,
        td {
            border: 1px solid #000000;
            padding: 12px;
        }

        th {
            background: #007bff;
            color: white;
        }

        tr:hover {
            background: #f1f1f1;
        }
    </style>
</head>

<body>

    <h1>Digital Glossary of HTML Tags</h1>
    <input type="text" id="searchBar" placeholder="Search HTML Tags...">

    <table id="tagTable">
        <thead>
            <tr>
                <th>Tag</th>
                <th>Description</th>
                <th>Example</th>
            </tr>
        </thead>
        <tbody>
        <td>&lt;b&gt;</td>
        <td>Bold text</td>
        <td>&lt;b&gt;Hello&lt;/b&gt;</td>
        </tr>
        <tr>
            <td>&lt;i&gt;</td>
            <td>Italic text</td>
            <td>&lt;i&gt;Hello&lt;/i&gt;</td>
        </tr>
        <tr>
            <td>&lt;u&gt;</td>
            <td>Underline text</td>
            <td>&lt;u&gt;Hello&lt;/u&gt;</td>
        </tr>
        <tr>
            <td>&lt;strong&gt;</td>
            <td>Important text</td>
            <td>&lt;strong&gt;Hello&lt;/strong&gt;</td>
        </tr>
        <tr>
            <td>&lt;mark&gt;</td>
            <td>Highlighted text</td>
            <td><mark>Hello</mark></td>
        </tr>
        <tr>
            <td>&lt;sub&gt;</td>
            <td>Subscript tag</td>
            <td>H<sub>2</sub>O</td>
        </tr>
        <tr>
            <td>&lt;h1&gt;</td>
            <td>Heading level 1 tag</td>
            <td><h1>Heading 1</h1>
        </tr>
        </tbody>

    </table>

    <script>
        document.getElementById("searchBar").addEventListener("keyup",searchTag);

        function searchTag(){
            let input = document.getElementById("searchBar").value.toLowerCase();
            let rows = document.querySelectorAll("#tagTable tbody tr");

            rows.forEach(function(row){
                let text = row.innerText.toLowerCase();

                if(text.includes(input))
                {
                    row.style.display = "";
                }else{
                    row.style.display = "none";
                }
            });
        }
    </script>
</body>

</html>

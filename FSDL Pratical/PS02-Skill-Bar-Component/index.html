<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Skill Bar Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: linear-gradient(135deg, #e0eafc, #cfdef3);
        }

        /* Main container */
        .container {
            max-width: 520px;
            margin: auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        }

        /* Heading */
        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        /* Inputs */
        input {
            padding: 10px;
            margin: 5px 0;
            width: 48%;
            border: 1px solid #ccc;
            border-radius: 6px;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: #4caf50;
            box-shadow: 0 0 5px rgba(76, 175, 80, 0.4);
        }

        /* Button */
        button {
            padding: 10px 15px;
            cursor: pointer;
            background: #4caf50;
            color: white;
            border: none;
            border-radius: 6px;
            margin-top: 10px;
            width: 100%;
            font-size: 16px;
            transition: 0.3s;
        }

        button:hover {
            background: #45a049;
        }

        /* Skill block */
        .skill {
            margin-top: 20px;
            padding: 10px;
            border-radius: 8px;
            background: #f9f9f9;
        }

        /* Skill label */
        .skill p {
            margin: 0 0 8px;
            font-weight: bold;
            color: #333;
        }

        /* Bar background */
        .bar {
            width: 100%;
            height: 22px;
            background: #e0e0e0;
            border-radius: 20px;
            overflow: hidden;
        }

        /* Fill animation */
        .fill {
            height: 100%;
            background: linear-gradient(90deg, #4caf50, #2e7d32);
            width: 0%;
            color: white;
            font-size: 12px;
            text-align: right;
            padding-right: 8px;
            line-height: 22px;
            border-radius: 20px;
            transition: width 0.6s ease-in-out;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Skill Bar Dashboard</h2>

        <input type="text" id="skillName" placeholder="Skill Name" />
        <input type="number" id="skillPercent" placeholder="%" />

        <button onclick="addSkill()">Add Skill</button>

        <div id="skillContainer"></div>
    </div>

    <script>
        function addSkill() {
            let name = document.getElementById("skillName").value;
            let percent = document.getElementById("skillPercent").value;

            if (name === "" || percent === "") {
                alert("Please enter values");
                return;
            }

            let container = document.getElementById("skillContainer");

            // Skill wrapper
            let skillDiv = document.createElement("div");
            skillDiv.className = "skill";

            // Skill label
            let label = document.createElement("p");
            label.innerText = name + " - " + percent + "%";

            // Bar
            let bar = document.createElement("div");
            bar.className = "bar";

            let fill = document.createElement("div");
            fill.className = "fill";
            fill.style.width = percent + "%";
            fill.innerText = percent + "%";

            bar.appendChild(fill);
            skillDiv.appendChild(label);
            skillDiv.appendChild(bar);

            container.appendChild(skillDiv);

            // clear inputs
            document.getElementById("skillName").value = "";
            document.getElementById("skillPercent").value = "";
        }
    </script>
</body>

</html>

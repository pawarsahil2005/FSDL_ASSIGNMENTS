<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes App</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial;
            background: #f4f6fb;
            line-height: 1.5;
        }

        /* HEADER */
        header {
            background: #4c8bf5;
            color: white;
            padding: 20px;
            text-align: center;
        }

        /* MAIN CONTAINER */
        .container {
            width: 90%;
            max-width: 700px;
            margin: 30px auto;
        }

        /* INPUT AREA */
        .input-area {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        textarea {
            flex: 1;
            height: 100px;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ccc;
            resize: none;
            font-size: 14px;
            outline: none;
        }

        /* BUTTON */
        button {
            background: #4c8bf5;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.3s;
        }

        button:hover {
            background: #2f5ef7;
        }

        /* NOTES LIST */
        .notes-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* SINGLE NOTE */
        .note {
            background: white;
            padding: 15px 20px;
            border-radius: 10px;
            box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.08);
            position: relative;

            word-wrap: break-word;
            overflow-wrap: break-word;
            white-space: pre-wrap;
            font-size: 15px;
        }

        /* DELETE BUTTON */
        .delete-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 30px;
            height: 30px;

            background: red;
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 14px;
            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .delete-btn:hover {
            background: darkred;
        }
    </style>

</head>

<body>


    <header>
        <h1>My Notes Application</h1>
    </header>


    <div class="container">


        <div class="input-area">

            <textarea id="noteInput" placeholder="Write your note here...">
        </textarea>

            <button onclick="addNote()">
                Add Note
            </button>

        </div>
        <div id="notesContainer" class="notes-container">
        </div>

    </div>


    <script>

        const noteInput = document.getElementById("noteInput");
        const notesContainer = document.getElementById("notesContainer");


        window.onload = function () {
            displayNotes();
        };


        function addNote() {
            const noteText = noteInput.value.trim();

            if (noteText === "") {
                alert("Enter Something..");
                return;
            }

            let notes = JSON.parse(localStorage.getItem("notes")) || [];

            notes.push(noteText);

            localStorage.setItem("notes", JSON.stringify(notes));
            noteInput.value = "";

            displayNotes();
        }

        function displayNotes() {
            notesContainer.innerHTML = "";

            let notes = JSON.parse(localStorage.getItem("notes")) || [];

            notes.forEach((note, index) => {
                const noteDiv = document.createElement("div");
                noteDiv.className = "note";

                noteDiv.innerHTML = `
                    ${note}
                    <button 
                    class="delete-btn" 
                    onClick="deleteNote(${index})" >
                        X
                    </button     
        `
                notesContainer.appendChild(noteDiv);
            });
        }


        function deleteNote(index) {
            let notes = JSON.parse(localStorage.getItem("notes"));

            notes.splice(index, 1);

            localStorage.setItem("notes", JSON.stringify(notes));

            displayNotes();
        }

    </script>

</body>

</html>

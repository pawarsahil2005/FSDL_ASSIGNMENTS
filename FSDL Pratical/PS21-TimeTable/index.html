<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            text-align: center;
        }

        .container{
            display: flex;
            justify-content: center;
            align-items: center;
        }

        table{
            width: 80%;
            margin: auto;
            border-collapse: collapse;
        }

        th,td{
            border: 1px solid black;
            padding: 10px;
            text-align: center;  
        }
    </style>
</head>

<body>
    <h1> Weekly Timetable </h1>
    <div class="container">
        
        <table>
            <thead>
                <tr>
                    <th>Day</th>
                    <th>9-10</th>
                    <th>10-11</th>
                    <th>11-12</th>
                    <th>12-1</th>
                    <th>1-2</th>
                    <th>2-3</th>
                    <th>3-4</th>
                    <th>4-5</th>
                    </th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <th>Monday</th>
                    <td colspan="2">SEL</td>
                    <td colspan="2">BTL</td>
                    <td rowspan="5" style="background-color: yellow;">LUNCH</td>
                    <td>SE</td>
                    <td>DAA</td>
                    <td>-</td>
                </tr>
                <tr>
                    <th>Tuesday</th>
                    <td>OS</td>
                    <td>DAA</td>
                    <td>BT</td>
                    <td>MDM</td>
                    <td>CC</td>
                    <td>-</td>
                    <td>-</td>
                </tr>
                <tr>
                    <th>Wednesday</th>
                    <td colspan="2">OSL</td>
                    <td>BT</td>
                    <td>MDM</td>
                    <td>CC</td>
                    <td colspan="2">FSDL</td>
                </tr>
                <tr>
                    <th>Thursday</th>
                    <td colspan="2">CCL</td>
                    <td colspan="2">FSDL</td>
                    <td>OS</td>
                    <td colspan="2">DAAL</td>
                </tr>
                <tr>
                    <th>Friday</th>
                    <td colspan="2">CCL</td>
                    <td colspan="2">BTL</td>
                    <th>-</th>
                    <th>-</th>
                    <th>-</th>
                </tr>
            </tbody>
    </div>
</body>

</html>

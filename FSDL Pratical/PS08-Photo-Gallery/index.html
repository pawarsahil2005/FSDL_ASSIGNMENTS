<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0px;
            padding: 0px;
        }

        h1 {
            text-align: center;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            max-width: 900px;
            margin: auto;
        }

        .box {
            position: relative;
            border: 1px solid black;
            padding: 10px;
            text-align: center;
            border-radius: 20px;
        }

        .box img {
            width: 100%;
            height: fit-content;
            transition: 0.3s;
        }

        .box:hover img {
            transform: scale(1.1);
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;

            background-color: rgb(0, 0, 0, 0.3);
            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            opacity: 0;
            transition: 0.3s;
        }

        .box:hover .overlay {
            opacity: 1;
        }
    </style>
</head>

<body>
    <h1>Photo Gallery</h1>
    <div class="gallery">
        <div class="box">
            <img src="./profile.png" alt="image1.png">
            <div class="overlay">Image 1</div>
        </div>
        <div class="box">
            <img src="./profile.png" alt="image2.png">
            <div class="overlay"> Image 2</div>
        </div>
        <div class="box">
            <img src="./profile.png" alt="image3.png">
            <div class="overlay"> Image 3</div>
        </div>
        <div class="box">
            <img src="./profile.png" alt="imgage4.png">
            <div class="overlay"> Image 4</div>
        </div>
        <div class="box">
            <img src="./profile.png" alt="imgage5.png">
            <div class="overlay"> Image 5</div>
        </div>
        <div class="box">
            <img src="./profile.png" alt="imgage6.png">
            <div class="overlay"> Image 6</div>
        </div>
    </div>
</body>

</html>
